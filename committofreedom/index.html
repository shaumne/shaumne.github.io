*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}

nav a:hover{border-color:var(--lamp);color:var(--lamp)}
h1{font-size:1.8rem;line-height:1.2;margin:0 0 1.25rem;text-wrap:balance}

p,li{max-width:66ch;overflow-wrap:anywhere}
p{margin:0 0 1rem}
ul{margin:0 0 1rem;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
a{color:var(--accent)}
hr{border:0;border-top:2px solid var(--line);margin:1.75rem 0}
blockquote{margin:0 0 1.5rem;padding:.9rem 1.1rem;border-left:3px solid var(--accent);background:var(--surface-2);color:var(--ink-soft)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:.05em .3em}
.tablewrap{overflow-x:auto;border:2px solid var(--line);margin:0 0 1.5rem}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
tbody tr:last-child td{border-bottom:0}
footer{margin-top:3rem;padding-top:1.25rem;border-top:2px solid var(--line);font-size:.88rem;color:var(--ink-soft)}
